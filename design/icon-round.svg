<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#E8EEF7"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC85C"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0057D2"/>
    </linearGradient>
    <clipPath id="leftClip">
      <circle cx="400" cy="512" r="240"/>
    </clipPath>
  </defs>

  <!-- squircle background -->
  <circle cx="512" cy="512" r="512" fill="url(#bg)"/>

  <!-- right circle: device -->
  <circle cx="624" cy="512" r="240" fill="url(#device)"/>

  <!-- left circle: coin -->
  <circle cx="400" cy="512" r="240" fill="url(#coin)"/>

  <!-- overlap: deep navy interlock -->
  <g clip-path="url(#leftClip)">
    <circle cx="624" cy="512" r="240" fill="#14376E"/>
  </g>

  <!-- coin inner ring detail -->
  <circle cx="400" cy="512" r="196" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10"/>

  <!-- negative-space downward chevron in overlap -->
  <path d="M 448 478 L 512 546 L 576 478"
        fill="none" stroke="#FFFFFF" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
